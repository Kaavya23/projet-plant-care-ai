name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Installer les dépendances (sans torch, allégé pour la CI)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-multipart requests \
            pandas numpy scikit-learn shap joblib sqlalchemy fsspec pyarrow \
            pytest httpx ruff
      - name: Lint (ruff)
        run: ruff check src ml pipelines || true
      - name: Générer données + entraîner le modèle d'arrosage
        run: |
          python ml/generate_synthetic_data.py
          python ml/train_watering.py
      - name: Tests
        run: PYTHONPATH=src pytest -q
