# Démarrage complet du POC en une commande :  docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plantcare
      POSTGRES_PASSWORD: plantcare
      POSTGRES_DB: plantcare
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantcare"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db
    ports: ["5000:5000"]
    volumes: ["mlruns:/mlruns"]

  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg2://plantcare:plantcare@postgres:5432/plantcare
      DATALAKE_BACKEND: minio
      MINIO_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    volumes: ["./ml/artifacts:/app/ml/artifacts"]

  dashboard:
    build: .
    depends_on: [api]
    environment:
      API_URL: http://api:8000
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]

volumes:
  pgdata:
  miniodata:
  mlruns:
